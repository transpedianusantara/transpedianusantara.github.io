<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | {{ site.title }}</title>

    <meta name="description"
          content="{{ page.description | default: site.description }}">

    <link rel="canonical"
          href="{{ page.url | absolute_url }}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 10%, rgba(65, 105, 225, .18), transparent 30%),
                radial-gradient(circle at 85% 20%, rgba(0, 200, 255, .10), transparent 30%),
                #07111f;
            color: #e8eef7;
            line-height: 1.8;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
        }

        nav {
            margin: 22px auto;
            padding: 16px 22px;

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 18px;

            background: rgba(255,255,255,.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        nav a {
            font-weight: 700;
            letter-spacing: -.01em;
        }

        main {
            padding: 70px 0;
        }

        article {
            max-width: 850px;
            margin: auto;
        }

        .eyebrow {
            color: #82a9ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(40px, 7vw, 72px);
            line-height: 1.02;
            letter-spacing: -.045em;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 30px;
            line-height: 1.2;
            margin-top: 50px;
            margin-bottom: 16px;
            letter-spacing: -.02em;
        }

        h3 {
            font-size: 22px;
            margin-top: 35px;
            margin-bottom: 12px;
        }

        p {
            margin-bottom: 20px;
            color: #b9c4d3;
        }

        .glass {
            padding: clamp(28px, 5vw, 55px);

            border-radius: 30px;

            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.10);

            box-shadow:
                0 30px 80px rgba(0,0,0,.25);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .meta {
            color: #7f8da1;
            font-size: 14px;
            margin-bottom: 40px;
        }

        hr {
            border: 0;
            border-top: 1px solid rgba(255,255,255,.08);
            margin: 45px 0;
        }

        footer {
            margin-top: 80px;
            padding: 35px 0;

            border-top: 1px solid rgba(255,255,255,.08);

            color: #718096;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            main {
                padding: 35px 0;
            }

            h1 {
                font-size: 43px;
            }

            h2 {
                font-size: 27px;
            }

            .glass {
                padding: 25px;
                border-radius: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <nav>
        <a href="{{ '/' | relative_url }}">
            Transpedia Nusantara
        </a>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer>
        © {{ site.time | date: "%Y" }} Transpedia Nusantara
    </footer>

</div>

</body>
</html>

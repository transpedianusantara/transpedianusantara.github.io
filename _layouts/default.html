<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | {{ site.title }}</title>

    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #07111f;
            color: #e8eef7;
            line-height: 1.8;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
        }

        nav {
            margin: 20px auto;
            padding: 16px 22px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            background: rgba(255,255,255,.06);
            backdrop-filter: blur(18px);
        }

        nav a {
            font-weight: 700;
        }

        main {
            padding: 70px 0;
        }

        article {
            max-width: 820px;
            margin: auto;
        }

        .eyebrow {
            color: #7da7ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(38px, 6vw, 68px);
            line-height: 1.05;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 28px;
            margin-top: 50px;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 20px;
            color: #b9c4d3;
        }

        .meta {
            color: #7f8da1;
            margin-bottom: 45px;
        }

        .glass {
            padding: 30px;
            border-radius: 24px;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.09);
            backdrop-filter: blur(18px);
        }

        footer {
            margin-top: 80px;
            padding: 35px 0;
            border-top: 1px solid rgba(255,255,255,.08);
            color: #718096;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            main {
                padding: 40px 0;
            }

            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <nav>
        <a href="{{ '/' | relative_url }}">
            Transpedia Nusantara
        </a>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer>
        © {{ site.time | date: "%Y" }} Transpedia Nusantara
    </footer>

</div>

</body>
</html>
